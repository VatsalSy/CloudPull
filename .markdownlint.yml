# Markdownlint configuration
# https://github.com/DavidAnson/markdownlint

default: true

# Line length - be lenient
MD013:
  line_length: 200
  code_blocks: false
  tables: false
  headings: false

# Allow inline HTML
MD033: false

# Allow duplicate headings (common in docs)
MD024:
  siblings_only: true

# Allow trailing punctuation in headings
MD026: false

# Allow multiple top-level headings (for some doc styles)
MD025: false

# Allow bare URLs
MD034: false

# Don't require blank lines around fenced code blocks
MD031: false

# Allow emphasis used instead of heading
MD036: false

# First line doesn't need to be a heading
MD041: false

# Allow code block style mixing
MD046: false

# Allow HTML comments
MD051: false
